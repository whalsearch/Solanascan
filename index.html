<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شکارچی میم‌کوین سولانا</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;line-height:1.6}.container{max-width:700px;margin:0 auto}h1{text-align:center;color:#f59e0b;margin-bottom:20px;font-size:1.8rem}.controls{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}button{background:#f59e0b;color:#111827;border:none;padding:12px 24px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .2s}button:active{transform:scale(.96)}button:disabled{opacity:.6;cursor:wait}.status{text-align:center;margin:10px 0;color:#94a3b8}.coin-list{list-style:none;padding:0}.coin-item{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 4px 10px rgba(0,0,0,.2)}.coin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.coin-name{font-weight:700;color:#fbbf24;font-size:1.1rem}.coin-symbol{color:#94a3b8;font-size:.85rem}.score{background:#0ea5e9;color:#fff;padding:4px 10px;border-radius:20px;font-size:.85rem;font-weight:700}.coin-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.85rem;color:#cbd5e1}.coin-details span{display:flex;justify-content:space-between}.coin-address{direction:ltr;background:#0f172a;padding:6px 10px;border-radius:6px;font-family:monospace;font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px;display:block;color:#38bdf8;text-decoration:none}.coin-address:hover{text-decoration:underline}.rugcheck-link{display:inline-block;margin-top:6px;background:#312e81;color:#e0e7ff;padding:5px 10px;border-radius:6px;font-size:.75rem;text-decoration:none}.rugcheck-link:hover{background:#4338ca}.empty{text-align:center;color:#94a3b8;padding:40px 0}.section-title{text-align:center;color:#fbbf24;font-size:1.3rem;margin:30px 0 15px;font-weight:700}</style></head><body><div class="container"><h1>🦈 شکارچی میم‌کوین سولانا</h1><div class="controls"><button id="r" onclick="R()">🔄 بروزرسانی</button><button id="c" onclick="CH()">🗑 پاک کردن تاریخچه</button></div><div class="status" id="s">در حال بارگذاری...</div><div class="section-title">نتایج الان</div><ul class="coin-list" id="l"></ul><div class="section-title">تاریخچه</div><ul class="coin-list" id="h"></ul></div><script>
const F={A:12,L:5000,V:10000,P:5,B:1.0,T:10},D='https://api.dexscreener.com/token-profiles/latest/v1',d=a=>`https://api.dexscreener.com/latest/dex/tokens/${a}`;
const HKEY='memeScannerHistory';
const HISTORY_LIMIT=50; // فقط ۵۰ توکن آخر نگه داشته می‌شود
const sl=ms=>new Promise(r=>setTimeout(r,ms)),fn=n=>n==null?'--':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(2)+'K':n.toFixed(2),fu=n=>'$'+fn(n),ta=t=>{let m=Math.floor((Date.now()-t)/6e4);if(m<60)return m+' دقیقه پیش';let h=Math.floor(m/60);if(h<24)return h+' ساعت پیش';return Math.floor(h/24)+' روز پیش'};
function loadH(){try{return JSON.parse(localStorage.getItem(HKEY))||{}}catch{return {}}}
function pruneH(h){let arr=Object.entries(h).sort((a,b)=>b[1].lastSeen-a[1].lastSeen).slice(0,HISTORY_LIMIT);let nh={};arr.forEach(([k,v])=>nh[k]=v);return nh}
function saveH(h){let pruned=pruneH(h);localStorage.setItem(HKEY,JSON.stringify(pruned));history=pruned}
let history=loadH();
function addToHistory(tokens){tokens.forEach(t=>{let addr=t.baseToken?.address;if(addr){let old=history[addr];history[addr]={...t,firstSeen:old?.firstSeen||Date.now(),lastSeen:Date.now()}}});saveH(history)}
async function ft(){let r=await fetch(D);if(!r.ok)throw 0;let j=await r.json();return j.filter(p=>p.chainId==='solana')}
async function fp(a){let r=await fetch(d(a));if(!r.ok)return null;let j=await r.json();if(!j.pairs||!j.pairs.length)return null;return j.pairs.sort((x,y)=>(y.liquidity?.usd||0)-(x.liquidity?.usd||0))[0]}
function pf(p){let ah=(Date.now()-p.pairCreatedAt)/36e5;if(ah>F.A||ah<0)return false;let lq=p.liquidity?.usd||0;if(lq<F.L)return false;let v=p.volume?.h24||0;if(v<F.V)return false;let pc=p.priceChange?.h24||0;if(pc<F.P)return false;let b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,rt=s>0?b/s:1;return rt>=F.B}
function cs(p){let lq=p.liquidity?.usd||0,v=p.volume?.h24||0,pc=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,rt=s>0?b/s:1,ah=(Date.now()-p.pairCreatedAt)/36e5;let ls=Math.min(lq/1e5,1)*20,vs=Math.min(v/2e5,1)*25,ps=Math.min(pc/100,1)*15,bs=Math.min(rt/2,1)*20,as=Math.min(1/Math.max(ah,.1),1)*10,ss=p.liquidity?.base&&p.liquidity?.quote?10:0;return ls+vs+ps+bs+as+ss}
function cardHTML(x){return `<li class="coin-item"><div class="coin-header"><div><span class="coin-name">${x.baseToken?.name||'نامشخص'}</span> <span class="coin-symbol">${x.baseToken?.symbol||''}</span></div><span class="score">امتیاز: ${x.score.toFixed(1)}</span></div><div class="coin-details"><span><span>نقدینگی:</span><span>${fu(x.liquidity?.usd)}</span></span><span><span>حجم ۲۴س:</span><span>${fu(x.volume?.h24)}</span></span><span><span>تغییر ۲۴س:</span><span style="color:#4ade80">${x.priceChange?.h24?.toFixed(2)||'0'}%</span></span><span><span>خرید/فروش:</span><span>${x.txns?.h24?.buys||0} / ${x.txns?.h24?.sells||0}</span></span><span><span>سن:</span><span>${ta(x.pairCreatedAt)}</span></span></div><a class="coin-address" href="https://dexscreener.com/solana/${x.pairAddress}" target="_blank">${x.pairAddress}</a><a class="rugcheck-link" href="https://rugcheck.xyz/tokens/${x.baseToken?.address}" target="_blank">🛡 بررسی امنیت (RugCheck)</a></li>`}
function rl(c){let e=document.getElementById('l');if(!c.length){e.innerHTML='<div class="empty">هیچ میم‌کوینی با این فیلترها پیدا نشد. 🤷‍♂️</div>';return}e.innerHTML=c.map(cardHTML).join('')}
function rh(){let e=document.getElementById('h');let arr=Object.values(history).sort((a,b)=>b.lastSeen-a.lastSeen).slice(0,50);if(!arr.length){e.innerHTML='<div class="empty">تاریخچه خالی است.</div>';return}e.innerHTML=arr.map(cardHTML).join('')}
function CH(){history={};saveH(history);rh();document.getElementById('s').textContent='تاریخچه پاک شد.'}
async function R(){let st=document.getElementById('s'),b=document.getElementById('r');b.disabled=true;st.textContent='در حال دریافت لیست توکن‌های سولانا...';try{let pr=await ft();st.textContent=`تعداد توکن پروفایل: ${pr.length} | در حال بررسی جفت‌ارزها...`;let pp=pr.slice(0,80).map(p=>fp(p.tokenAddress).then(async x=>{await sl(100);return x}));let ps=(await Promise.all(pp)).filter(x=>x&&x.chainId==='solana');st.textContent=`بررسی ${ps.length} جفت‌ارز...`;let fil=ps.filter(pf).map(x=>({...x,score:cs(x)})).sort((a,b)=>b.score-a.score).slice(0,F.T);let newTokens=fil.filter(x=>!history[x.baseToken?.address]);addToHistory(fil);rl(newTokens);rh();st.textContent=`آخرین بروزرسانی: ${new Date().toLocaleTimeString('fa-IR')}`}catch(e){console.error(e);st.textContent='خطا در دریافت داده‌ها. لطفاً دوباره تلاش کنید.'}finally{b.disabled=false}}
window.addEventListener('load',()=>{R();rh();setInterval(R,3e5)})
</script></body></html>
